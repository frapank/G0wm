name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tarball:
    name: binary tarball
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git github-cli
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/arch-deps
      - run: make -j"$(nproc)"
      - run: make tarball
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/pkg/g0wm-*-linux-*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
