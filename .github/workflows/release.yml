name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  packages:
    name: tarball, .deb and .rpm
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install git for the checkout and gh for the upload
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates gh
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/ubuntu-deps
      - name: Build with wlroots and libscfg inside the binary
        run: ./configure --bundle-deps
      - run: make -j"$(nproc)"
      - name: Smoke test the binary
        run: |
          out=$(./g0wm -v 2>&1) || true
          printf '%s\n' "$out"
          case $out in g0wm\ *) ;; *) echo "g0wm -v did not run" >&2; exit 1 ;; esac
      - name: Build the tarball, .deb and .rpm
        run: make packages MAINTAINER="g0wm <noreply@github.com>"
      - name: Write the checksums
        working-directory: build/pkg
        run: sha256sum g0wm-*.tar.gz g0wm_*.deb g0wm-*.rpm | tee SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: build/pkg
        run: |
          gh release upload "$TAG" g0wm-*.tar.gz g0wm_*.deb g0wm-*.rpm SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
