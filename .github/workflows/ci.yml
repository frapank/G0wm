name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc,             cc: gcc,   flags: "" }
          - { name: clang,           cc: clang, flags: "" }
          - { name: gcc sanitizers,  cc: gcc,   flags: "--debug --enable-sanitizers" }
          - { name: gcc LTO,         cc: gcc,   flags: "--enable-lto" }
          - { name: gcc hardening,   cc: gcc,   flags: "--enable-hardening" }
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/arch-deps
      - run: ./configure --compiler=${{ matrix.cc }} ${{ matrix.flags }}
      - run: make -j"$(nproc)"
      - run: make test
      - name: Smoke test the binary
        run: |
          out=$(./g0wm -v 2>&1) || true
          printf '%s\n' "$out"
          case $out in g0wm\ *) ;; *) echo "g0wm -v did not run" >&2; exit 1 ;; esac

  features:
    name: features (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: no xwayland,   flags: "--disable-xwayland" }
          - { name: no background, flags: "--no-integrated-background" }
          - name: minimal
            flags: --disable-xwayland --no-integrated-background
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/arch-deps
      - run: ./configure ${{ matrix.flags }}
      - run: make -j"$(nproc)"

  install:
    name: clone and install
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/arch-deps
      - run: ./configure && make -j"$(nproc)"
      - name: Install to a throwaway prefix
        run: |
          make install BINDIR="$PWD/_install"
          test -x _install/g0wm

  packages:
    name: packages
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/ubuntu-deps
      - run: ./configure --bundle-deps
      - name: Show how wlroots and libscfg were built
        if: failure()
        run: cat subprojects/build.log
      - run: make -j"$(nproc)"
      - run: make test
      - name: Smoke test the binary
        run: |
          out=$(./g0wm -v 2>&1) || true
          printf '%s\n' "$out"
          case $out in g0wm\ *) ;; *) echo "g0wm -v did not run" >&2; exit 1 ;; esac
      - name: Build the tarball, .deb and .rpm
        run: make packages MAINTAINER="g0wm <noreply@github.com>"
      - name: Show what the packages depend on
        run: |
          dpkg-deb -f build/pkg/g0wm_*.deb Depends
          rpm -qpR build/pkg/g0wm-*.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: g0wm-packages
          path: build/pkg/g0wm*
          if-no-files-found: error

  install-packages:
    name: install (${{ matrix.name }})
    needs: packages
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 .deb
            image: ubuntu:26.04
            install: apt-get update && apt-get install -y --no-install-recommends ./g0wm_*.deb
          - name: Debian testing .deb
            image: debian:testing
            install: apt-get update && apt-get install -y --no-install-recommends ./g0wm_*.deb
          - name: Fedora 44 .rpm
            image: fedora:44
            install: dnf install -y --setopt=install_weak_deps=False ./g0wm-*.rpm
          - name: openSUSE Tumbleweed .rpm
            image: opensuse/tumbleweed
            install: >-
              zypper --non-interactive install --no-recommends --allow-unsigned-rpm
              ./g0wm-*.rpm
          # the libraries the bundled wlroots needs
          - name: Arch tarball
            image: archlinux:base
            install: >-
              pacman -Syu --noconfirm wlroots0.20 fcft gdk-pixbuf2 &&
              tar -xzf g0wm-*.tar.gz -C /
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: g0wm-packages
      - name: Install
        run: ${{ matrix.install }}
      - name: Run it
        run: |
          out=$(g0wm -v 2>&1) || true
          printf '%s\n' "$out"
          case $out in
          g0wm\ *) ;;
          *) ldd /usr/bin/g0wm | grep 'not found' >&2
             echo "g0wm -v did not run" >&2; exit 1 ;;
          esac

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install "clang-format==21.1.7"
      - run: make format-check

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          make shellcheck

  manpage:
    name: man page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mandoc
      - run: mandoc -T lint -W warning docs/g0wm.1

  reuse:
    name: reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v6
